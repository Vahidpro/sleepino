name: Release APK

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.1.0). If empty, uses app/build.gradle.kts versionName'
        required: false
        default: ''

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_info.outputs.tag }}
      version_name: ${{ steps.tag_info.outputs.version_name }}
      should_run: ${{ steps.tag_info.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag and Check Automation Trigger
        id: tag_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)"[[:space:]]*$/\1/')
          RAW_VERSION="${RAW_VERSION:-1.1.0}"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            SHOULD_RUN="true"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            SHOULD_RUN="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag_name }}" ]; then
              TAG="${{ inputs.tag_name }}"
            else
              TAG="v${RAW_VERSION}"
            fi
            SHOULD_RUN="true"
          else
            # Push to main: automate release only when versionName introduces a new tag/release
            TAG="v${RAW_VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release/tag ${TAG} already exists; skipping automated release on branch push."
              SHOULD_RUN="false"
            else
              echo "New version ${TAG} detected on main; triggering automated release."
              SHOULD_RUN="true"
            fi
          fi

          VERSION_NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Selected release tag: $TAG (versionName: $VERSION_NAME, should_run: $SHOULD_RUN)"

  build-and-publish:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run verification checks
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Build Universal & Architecture Release APKs
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" \
            -PsplitAbi=true \
            -PversionName="$VERSION_NAME" \
            :app:assembleRelease

      - name: Sign APKs & Generate SHA-256 Checksums
        id: package_apks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"

          KEYSTORE_FILE="/tmp/release.keystore"
          USED_TEMP_KEYSTORE="false"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing APKs with repository keystore secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            KS_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            SIGN_ALIAS="$KEY_ALIAS"
          else
            echo "No custom keystore secrets found. Generating release key for signing..."
            USED_TEMP_KEYSTORE="true"
            KS_PASS="sleepinopass"
            KEY_PASS="sleepinopass"
            SIGN_ALIAS="sleepino"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$SIGN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Sleepino, O=Sleepino, C=US"
          fi

          DIST_DIR="dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          APK_FILES=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | sort)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No release APKs found in app/build/outputs/apk/release"
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          for UNSIGNED_APK in $APK_FILES; do
            BASE=$(basename "$UNSIGNED_APK")
            case "$BASE" in
              app-universal-release*) ARCH="universal" ;;
              app-arm64-v8a-release*) ARCH="arm64-v8a" ;;
              app-armeabi-v7a-release*) ARCH="armeabi-v7a" ;;
              app-x86_64-release*) ARCH="x86_64" ;;
              app-x86-release*) ARCH="x86" ;;
              *)
                ARCH=$(echo "$BASE" | sed -E 's/^app-(.+)-release.*\.apk$/\1/')
                ;;
            esac

            FINAL_NAME="sleepino-${TAG}-${ARCH}.apk"
            FINAL_PATH="${DIST_DIR}/${FINAL_NAME}"
            echo "Signing $BASE -> $FINAL_NAME"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$SIGN_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$FINAL_PATH" \
              "$UNSIGNED_APK"

            "$APKSIGNER" verify --verbose "$FINAL_PATH"
          done

          CERT_SHA256=$("$APKSIGNER" verify --print-certs "${DIST_DIR}/sleepino-${TAG}-universal.apk" | grep -i "SHA-256 digest:" | head -n 1 | awk -F': ' '{print $2}')
          rm -f "$KEYSTORE_FILE"

          if [ "$USED_TEMP_KEYSTORE" = "true" ]; then
            echo "### ℹ️ APK Signing Note" >> "$GITHUB_STEP_SUMMARY"
            echo "Release APKs were signed using an auto-generated key because \`KEYSTORE_BASE64\` and \`KEY_ALIAS\` were not set in repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

          (
            cd "$DIST_DIR"
            for APK in *.apk; do
              sha256sum "$APK" > "${APK}.sha256"
            done
            sha256sum *.apk > "sleepino-${TAG}-SHA256SUMS.txt"
          )

          # Build release notes with automated SHA-256 verification table
          BODY_FILE="/tmp/release-body.md"
          if [ -f "RELEASE_NOTES.md" ]; then
            cp "RELEASE_NOTES.md" "$BODY_FILE"
            printf "\n---\n\n" >> "$BODY_FILE"
          else
            : > "$BODY_FILE"
          fi

          {
            echo "## 📦 Downloads & SHA-256 Checksums"
            echo ""
            echo "| File | Architecture | Size | SHA-256 |"
            echo "| :--- | :--- | ---: | :--- |"
            for ARCH in universal arm64-v8a armeabi-v7a x86_64 x86; do
              APK_NAME="sleepino-${TAG}-${ARCH}.apk"
              if [ -f "${DIST_DIR}/${APK_NAME}" ]; then
                SIZE_BYTES=$(wc -c < "${DIST_DIR}/${APK_NAME}")
                SIZE_MB=$(awk "BEGIN {printf \"%.2f MB\", ${SIZE_BYTES}/1048576}")
                HASH=$(awk '{print $1}' "${DIST_DIR}/${APK_NAME}.sha256")
                case "$ARCH" in
                  universal) DESC="All devices (Universal APK)" ;;
                  arm64-v8a) DESC="Modern 64-bit ARM phones & tablets" ;;
                  armeabi-v7a) DESC="Older 32-bit ARM devices" ;;
                  x86_64) DESC="64-bit x86 emulators & Chromebooks" ;;
                  x86) DESC="32-bit x86 emulators & devices" ;;
                esac
                echo "| \`${APK_NAME}\` | ${DESC} | ${SIZE_MB} | \`${HASH}\` |"
              fi
            done
            echo ""
            echo "Verify all downloads with:"
            echo "\`\`\`bash"
            echo "sha256sum -c sleepino-${TAG}-SHA256SUMS.txt"
            echo "\`\`\`"
            if [ -n "$CERT_SHA256" ]; then
              echo ""
              echo "**Signing Certificate SHA-256:** \`${CERT_SHA256}\`"
            fi
          } >> "$BODY_FILE"

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$DIST_DIR"

      - name: Upload Release APKs & Checksums to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sleepino-${{ needs.prepare.outputs.tag }}-apks
          path: ${{ steps.package_apks.outputs.dist_dir }}/*
          retention-days: 90

      - name: Publish Release Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: ${{ steps.package_apks.outputs.dist_dir }}
          BODY_FILE: ${{ steps.package_apks.outputs.body_file }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading APK and SHA-256 assets..."
            gh release upload "$TAG" "${DIST_DIR}"/* --clobber
            gh release edit "$TAG" --notes-file "$BODY_FILE"
          else
            echo "Creating GitHub Release $TAG with multi-architecture APKs and SHA-256 checksums..."
            gh release create "$TAG" "${DIST_DIR}"/* \
              --target "$GITHUB_SHA" \
              --title "Sleepino $TAG" \
              --notes-file "$BODY_FILE"
          fi
          echo "Release $TAG successfully published!"
